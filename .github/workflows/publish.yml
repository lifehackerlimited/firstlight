name: Collect & publish

on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours
  workflow_dispatch:
    inputs:
      social_now:
        description: "Post today's signal to Bluesky/X now (ignores the once-a-day timing)"
        type: boolean
        default: false
  push:
    branches: [main]

# Least privilege by default; only the deploy job may write to Pages.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the Anthropic SDK (AI summaries)
        run: pip install -r scripts/requirements.txt
      - name: Collect sources
        run: python scripts/collect.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # read-only; raises the GitHub search rate limit
          # Optional. Sources and features that need these are skipped quietly until you add them
          # (Settings → Secrets and variables → Actions). They never reach the website.
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USERNAME: ${{ secrets.REDDIT_USERNAME }}
          PRODUCTHUNT_TOKEN: ${{ secrets.PRODUCTHUNT_TOKEN }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          ARCHIVE_KEY: ${{ secrets.ARCHIVE_KEY }}
      - name: AI summaries
        run: python scripts/summarize.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NASCENT_AI_MODEL: ${{ vars.NASCENT_AI_MODEL }}
      - name: Team API feeds
        run: python scripts/digest.py team-api
        env:
          STRIPE_KEY: ${{ secrets.STRIPE_KEY }}
          ARCHIVE_KEY: ${{ secrets.ARCHIVE_KEY }}
      - name: Build pages
        run: python scripts/build.py
      - name: Post the daily signal to Bluesky / X (optional)
        run: python scripts/social.py
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          SOCIAL_POST_HOUR: ${{ vars.SOCIAL_POST_HOUR }}
          SOCIAL_FORCE: ${{ inputs.social_now && '1' || '' }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
